name: .NET

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x
        
    - name: Restore API
      run: dotnet restore Race-Day/Race-Day.csproj
      
    - name: Build API
      run: dotnet build Race-Day/Race-Day.csproj --no-restore --configuration Release
      
    - name: Restore MVC
      run: dotnet restore RaceDay.MVC/RaceDay.MVC.csproj
      
    - name: Build MVC
      run: dotnet build RaceDay.MVC/RaceDay.MVC.csproj --no-restore --configuration Release
      
    - name: Test
      run: dotnet test RaceDay.test/RaceDay.test.csproj --configuration Release --verbosity normal
