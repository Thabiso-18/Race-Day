
name: Race-Day Documentation Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  documentation-check:
    name: Validate Project Documentation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check required documentation files
        shell: bash
        run: |
          set -e

          required_files=(
            "docs/schema.sql"
            "docs/erd.png"
            "docs/endpoints.md"
          )

          missing=0

          for file in "${required_files[@]}"; do
            if [ -f "$file" ]; then
              echo "PASS: $file exists"
            else
              echo "FAIL: $file is missing"
              missing=1
            fi
          done

          if [ "$missing" -ne 0 ]; then
            echo "Please add the missing documentation files."
            exit 1
          fi

      - name: Validate SQL schema file
        shell: bash
        run: |
          if [ -s docs/schema.sql ]; then
            echo "PASS: SQL schema is not empty"
          else
            echo "FAIL: SQL schema is empty"
            exit 1
          fi

      - name: Validate API endpoint documentation
        shell: bash
        run: |
          if [ -s docs/endpoints.md ]; then
            echo "PASS: API endpoint documentation is not empty"
          else
            echo "FAIL: API endpoint documentation is empty"
            exit 1
          fi

      - name: Validate ERD image
        shell: bash
        run: |
          file docs/erd.png

          if file docs/erd.png | grep -q "PNG image data"; then
            echo "PASS: ERD is a valid PNG image"
          else
            echo "FAIL: ERD must be a valid PNG image"
            exit 1
          fi

      - name: Documentation check summary
        if: success()
        run: echo "All required Race-Day documentation checks passed."
