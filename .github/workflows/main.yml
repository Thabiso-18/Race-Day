# Navigate to project
cd C:\Users\Student\source\repos\Race-Day

# ---- STEP 1: Create workflow ----
New-Item -ItemType Directory -Force -Path ".github\workflows" | Out-Null

$workflow = @'
name: RaceDay CI

on:
  push:
    branches: [ main, develop, part2 ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore Race-Day.sln

      - name: Build solution
        run: dotnet build Race-Day.sln --no-restore --configuration Release

      - name: Run unit tests
        run: dotnet test RaceDay.test/RaceDay.test.csproj --no-build --configuration Release --verbosity normal --logger "trx;LogFileName=test-results.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/test-results.trx'
'@

Set-Content -Path ".github\workflows\ci.yml" -Value $workflow -Encoding utf8

# ---- STEP 2: Verify ----
Write-Host "`n Workflow file created:" -ForegroundColor Green
Get-ChildItem ".github\workflows"

# ---- STEP 3: Git init if needed ----
if (-not (Test-Path ".git")) {
    Write-Host "`n Initializing Git repository..." -ForegroundColor Yellow
    git init
    git branch -M main
}

# ---- STEP 4: Stage, commit, push ----
git add .github/workflows/ci.yml
git commit -m "ci: add GitHub Actions workflow for build and test"


Write-Host "`n Done! Check the Actions tab on GitHub." -ForegroundColor Green
